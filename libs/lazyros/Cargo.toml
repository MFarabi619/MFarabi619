[package]
name    = "lazyros-core"
edition = "2024"
version = "0.1.0"

[lib]
name = "lazyros_core"
path = "src/lib.rs"

[[bin]]
name = "lazyros"
path = "src/bin/lazyros.rs"

[dependencies]
oxidros = { git = "https://github.com/jazi007/oxidros", rev = "566e2efdff31e39b372bab54fb75b2e836ba5ca7", features = ["zenoh"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "all-widgets", "layout-cache"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

[lints.clippy]
all = "deny"
