serial_number: rover-0000
version: 0
system:
  namespace: ""
  hosts:
    - hostname: rpi5-16-2
      ip: 10.0.0.208
platform:
  attachments: []
sensors:
  camera:
    - model: orbbec_gemini_335l
      parent: camera_mount_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.31, 0.0]
      ros_parameters:
        camera_0:
          name: camera_0
          source: "rpi5-16-2:8887"
          stream_path: "/stream"
          width: 1280
          height: 720
          fov_deg: 90.0
    - model: imx296_gs
      parent: camera_mount_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.31, 0.0]
      ros_parameters:
        camera_1:
          name: camera_1
          source: "rpi5-16-2:8888"
          stream_path: ""
          width: 1456
          height: 1088
          fov_deg: 54.0
  gps:
    - model: gpsd
      parent: base_link
      ros_parameters:
        gps:
          host: rpi5-16-2
        nmea_navsat_driver:
          ip: rpi5-16-2
          port: 9001
          buffer_size: 4096
          frame_id: gps_link
mounts:
  camera_mount:
    - parent: base_link
      xyz: [0.2, 0.0, 0.75]
      rpy: [0.0, 0.0, 0.0]
