serial_number: robot-0003
version: 1
system:
  namespace: robot3
  hosts:
    - hostname: beagleyai
      ip: &host 10.0.0.222
      board: beagley_ai
platform:
  attachments: []
  # HotRC F-06A: receiver row `+` -> pin 2 (5V), row `-` -> pin 6 (GND);
  # each signal through a divider (2.2k series, 3.3k to GND) -- 3.3V-only GPIOs
  rc_receiver:
    launch_enabled: false
    tank_mixed: true
    channel_1_pin: 16
    channel_2_pin: 18
  # RC ESC: signal + ground ONLY per channel -- never the CH `+` pin (5V BEC out);
  # header GND pin 39 -> controller GND
  drivetrain:
    model: rc_pulse
    max_linear_velocity_mps: 2.0
    left:
      pwm_pin: 38 # -> CH1 s
      reversed: false
    right:
      pwm_pin: 32 # -> CH2 s
      reversed: false
  # Parked MDD10A wiring (model: pwm_dir): GND pin 39 -> driver GND;
  # motors on M1A/M1B (left), M2A/M2B (right)
  #   pwm_frequency_hz: 20000.0
  #   left:  {pwm_pin: 38, dir_pin: 36, forward_level: true}   # PWM1 / DIR1
  #   right: {pwm_pin: 32, dir_pin: 31, forward_level: false}  # PWM2 / DIR2
sensors:
  camera:
    - model: orbbec_gemini_335l
      parent: base_link
      xyz: [0.575, 0.5, 0.31]
      rpy: [0.0, 0.31, 0.0]
      ros_parameters:
        camera_0:
          color_width: 640
          color_height: 480
          color_fps: 10
          jpeg_quality: 60
          enable_depth: true
          depth_width: 848
          depth_height: 480
          depth_fps: 15
          depth_decimation: 2
  imu:
    - model: bno085
      parent: base_link
      xyz: [0.0, 0.0, 0.3]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        imu_0:
          i2c_bus: 1
          i2c_address: 74
          frame_id: imu_0_link
          rate_hz: 25.0
  # gps disabled 2026-07-27 — no data on the UART (suspected module TX→pin-10 wiring); re-enable after bench check
  # gps:
  #   - model: adafruit_ultimate_gps_hat
  #     parent: base_link
  #     ros_parameters:
  #       nmea_navsat_driver:
  #         port: /dev/ttyAMA0
  #         baud: 9600
  #         frame_id: gps_link
mounts:
  camera_mount:
    - parent: base_link
      xyz: [0.2, 0.0, 0.75]
      rpy: [0.0, 0.0, 0.0]
