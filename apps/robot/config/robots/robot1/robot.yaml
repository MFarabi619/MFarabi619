serial_number: robot-0001
version: 1
system:
  namespace: robot1
  hosts:
    - hostname: rpi5-16-2
      ip: 10.0.0.28
      board: rpi_5
platform:
  attachments: []
  # RC ESC: signal + ground ONLY per channel -- never the CH `+` pin (5V BEC out);
  # header GND pin 39 -> controller GND
  drivetrain:
    model: rc_pulse
    max_linear_velocity_mps: 2.0
    left:
      pwm_pin: 32 # -> CH2 s (physical left motor)
      reversed: false
    right:
      pwm_pin: 33 # -> CH1 s (physical right motor)
      reversed: false
  # Parked dual-MD30C wiring (model: pwm_dir): GND -> BOTH drivers' GND (common ground)
  #   pwm_frequency_hz: 20000.0
  #   left:  {pwm_pin: 33, dir_pin: 36, forward_level: true}   # left MD30C PWM / DIR
  #   right: {pwm_pin: 32, dir_pin: 40, forward_level: false}  # right MD30C PWM / DIR
sensors:
  camera:
    - model: orbbec_gemini_335l
      parent: base_link
      xyz: [0.575, 0.5, 0.31]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        camera_0:
          color_width: 640
          color_height: 480
          color_fps: 30
          jpeg_quality: 60
          enable_depth: true
          depth_width: 848
          depth_height: 480
          depth_fps: 15
          depth_decimation: 2
  imu: []
  gps: []
mounts:
  camera_mount: []
