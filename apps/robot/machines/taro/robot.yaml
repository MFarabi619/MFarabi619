serial_number: mark-0
version: 1
system:
  namespace: taro
  hosts:
    - hostname: rpi5-16-2
      ip: 10.81.190.228
      board: rpi_5
platform:
  attachments: []
  rc_receiver:
    launch_enabled: false
    channel_1_pin: 29
    channel_2_pin: 31
  drivetrain:
    # model: rc_pulse
    model: roboteq
    serial_port: /dev/serial/by-id/usb-RoboteQ_RoboteQ_SBLMG2360T_GwBAABhQRUhMNTIg_207235674845-if00
    baud_rate: 115200
    counts_per_revolution: 90
    control_mode: open_loop
    full_scale_linear_velocity_meters_per_second: 2.0
    roboteq:
      max_linear_acceleration_meters_per_second_squared: 5.0
      max_angular_acceleration_radians_per_second_squared: 7.5
    rc_pulse:
      max_linear_velocity_meters_per_second: 1.37
      max_angular_velocity_radians_per_second: 3.0
      max_linear_acceleration_meters_per_second_squared: 8.0
      max_linear_jerk_meters_per_second_cubed: 60.0
      max_angular_acceleration_radians_per_second_squared: 10.0
      max_angular_jerk_radians_per_second_cubed: 70.0
    left:
      pwm_pin: 32
      reversed: false
    right:
      pwm_pin: 33
      reversed: true
sensors:
  camera:
    - model: orbbec_gemini_335l
      parent: base_link
      xyz: [0.53, 0.475, 0.469]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        camera_0:
          color_width: 640
          color_height: 480
          color_fps: 30
          jpeg_quality: 60
          enable_depth: true
          depth_width: 848
          depth_height: 480
          depth_fps: 15
          depth_decimation: 2
  imu: []
  gps:
    - model: ublox_zed_f9p
      parent: base_link
      ros_parameters:
        nmea_navsat_driver:
          port: /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00
          baud: 115200
          frame_id: gps_link
      ntrip:
        mountpoint: OsgoodeFarms
        username: farabi@tandemrobotics.ca
mounts:
  camera_mount: []
point_cloud:
  enabled: true
detector:
  max_detections_per_second: 10.0
follow:
  max_forward_speed: 0.7
  max_backward_speed: 0.7
  max_angular_speed: 0.7
  standoff_distance: 1.5
  distance_gain: 0.9
  distance_damping: 0.4
  distance_deadband: 0.25
  steer_gain: 0.5
  steer_damping: 0.7
  steer_deadband: 0.15
  command_smoothing_seconds: 0.3
  max_missing_frames: 24
follow_nav2:
  enabled: false
gps_navigation:
  enabled: true
  linear_velocity_meters_per_second: 0.7
home:
  latitude: 45.4662575
  longitude: -75.48316016666666
hand_gesture:
  enabled: false
harvest_lane:
  enabled: true
  detector:
    normalize_exposure: true
    normalized_excess_green_min: 0.06
  navigator:
    row_pitch_m: 1.17
    forward_speed_mps: 0.3
    max_forward_speed_mps: 0.5
    max_angular_speed_radps: 0.55
sidewalk:
  enabled: false
  follow:
    forward_speed: 0.4
    steer_gain: 1.2
    max_angular_speed: 0.8
