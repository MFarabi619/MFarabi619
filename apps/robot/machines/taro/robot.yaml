# yaml-language-server: $schema=../robot.schema.json
system:
  namespace: taro
  hosts:
    - hostname: rpi5-16-2
      ip: 10.81.190.228
      board: rpi_5
platform:
  attachments: []
  rc_receiver:
    launch_enabled: false
    channel_1_pin: 29
    channel_2_pin: 31
  drivetrain:
    # model: rc_pulse
    model: roboteq
    serial_port: /dev/robot/roboteq
    baud_rate: 115200
    counts_per_revolution: 90
    control_mode: open_loop
    full_scale_linear_velocity_meters_per_second: 2.0
    roboteq:
      max_linear_acceleration_meters_per_second_squared: 5.0
      max_angular_acceleration_radians_per_second_squared: 7.5
      flash:
        # Controller flash asserted by roboteq_motor_driver at connect.
        # RC receiver: connector pins 15/2 = pulse inputs 7/8.
        PMOD: {7: 1, 8: 1}        # 1 = capture RC pulse width
        PINA: {7: 17, 8: 33}      # use + motor: 17 = command motor 1, 33 = command motor 2
        PPOL: {7: 0, 8: 1}        # input 8 inverted: mirrored right motor, RC path only
        PMIN: {7: 0, 8: 0}        # microseconds mapped to full reverse
        PMAX: {7: 3000, 8: 3000}  # with PMIN as a pair, symmetric around 1500; stick spans 1000-2000:
                                  # PMIN/PMAX 0/3000 = 33%, 500/2500 = 50%, 750/2250 = 57%, 1000/2000 = 100%
        MDIR: {1: 0, 2: 0}        # 0 = direct
        MMOD: {1: 0, 2: 0}        # 0 = open loop
        ALIM: {1: 300, 2: 300}    # deciamps
        RWD: 1000                 # serial watchdog ms: RC takes over after 1 s of ROS silence
    rc_pulse:
      max_linear_velocity_meters_per_second: 1.37
      max_angular_velocity_radians_per_second: 3.0
      max_linear_acceleration_meters_per_second_squared: 8.0
      max_linear_jerk_meters_per_second_cubed: 60.0
      max_angular_acceleration_radians_per_second_squared: 10.0
      max_angular_jerk_radians_per_second_cubed: 70.0
    left:
      pwm_pin: 32
      is_reversed: false
    right:
      pwm_pin: 33
      is_reversed: true
sensors:
  camera:
    - model: orbbec_gemini_335l
      parent: base_link
      xyz: [0.53, 0.475, 0.469]
      rpy: [0.0, 0.0, 0.0]
      parameters:
        color_width_pixels: 640
        color_height_pixels: 480
        color_frames_per_second: 30
        enable_depth: true
        depth_width_pixels: 848
        depth_height_pixels: 480
        depth_frames_per_second: 15
        depth_decimation: 2
  imu: []
  gps:
    - model: ublox_zed_f9p
      parent: base_link
      flash:
        # Receiver flash asserted by ublox_flash at launch.
        CFG_RATE_MEAS: 200  # milliseconds between measurements = 5 Hz
        CFG_RATE_NAV: 1  # navigation solutions per measurement
      parameters:
        port: /dev/robot/gnss
        baud_rate: 115200
        frame_id: gps_link
      ntrip:
        mountpoint: OsgoodeFarms
        username: farabi@tandemrobotics.ca
mounts:
  camera_mount: []
behaviors:
  gps_navigation: true
  harvest_lane: true
home:
  latitude: 45.465033166666664
  longitude: -75.48172833333334
ros_parameters:
  person_detector:
    max_detections_per_second: 10.0
  person_follow:
    max_forward_speed_meters_per_second: 0.7
    max_backward_speed_meters_per_second: 0.7
    max_angular_speed_radians_per_second: 0.7
    standoff_distance_meters: 1.5
    distance_gain: 0.9
    distance_damping: 0.4
    distance_deadband_meters: 0.25
    steer_gain: 0.5
    steer_damping: 0.7
    steer_deadband_meters: 0.15
    command_smoothing_seconds: 0.3
    max_missing_frames: 24
  canopy_detector:
    normalize_exposure: true
    normalized_excess_green_min: 0.06
  harvest_lane_navigator:
    row_pitch_meters: 1.17
    forward_speed_meters_per_second: 0.3
    max_forward_speed_meters_per_second: 0.5
    max_angular_speed_radians_per_second: 0.55
  sidewalk_follow:
    forward_speed_meters_per_second: 0.4
    steer_gain: 1.2
    max_angular_speed_radians_per_second: 0.8
  controller_server:
    FollowPath:
      desired_linear_vel: 0.7
