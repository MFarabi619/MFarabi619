# yaml-language-server: $schema=../robot.schema.json
system:
  namespace: saburo
  hosts:
    - hostname: jetson-orin-nano
      ip: 10.0.0.180
      board: jetson_orin_nano
platform:
  rc_receiver:
    interface: usb_joystick
  drivetrain:
    model: analog_throttle
    full_scale_linear_velocity_meters_per_second: 2.0
    # Skid-steer wheels scrub sideways when spinning, so turns need more than the true track.
    wheel_separation_multiplier: 1.5
    i2c_bus: 7
    min_throttle_volts: 1.0
    max_throttle_volts: 4.0
    analog_throttle:
      max_linear_acceleration_meters_per_second_squared: 5.0
      max_angular_acceleration_radians_per_second_squared: 7.5
    left:
      is_reversed: false
      dac_i2c_address: 0x63
      dir_pin: 7
    right:
      is_reversed: false
      dac_i2c_address: 0x62
      dir_pin: 33
sensors:
  camera:
    - model: stereolabs_zed
      urdf_enabled: false
      parent: base_link
      xyz: [0.53, 0.0, 0.114]
      rpy: [0.0, 0.0, 0.0]
      parameters:
        general:
          camera_model: zed2i
          grab_resolution: HD720
          grab_frame_rate: 30
          pub_frame_rate: 30.0
        depth:
          depth_mode: NEURAL_PLUS
          depth_stabilization: 0
          openni_depth_mode: true
          publish_depth_image: true
          point_cloud_freq: 15.0
        object_detection:
          od_enabled: false
        pos_tracking:
          pos_tracking_enabled: false
          publish_tf: false
          publish_map_tf: false
        sensors:
          publish_imu_tf: false
  gps:
    - model: ublox_zed_f9p
      parent: base_link
      xyz: [0.0, 0.0, 0.114]
      flash:
        # Receiver flash asserted by ublox_flash at launch.
        CFG_RATE_MEAS: 200  # milliseconds between measurements = 5 Hz
        CFG_RATE_NAV: 1  # navigation solutions per measurement
      parameters:
        port: /dev/robot/gnss
        baud_rate: 115200
        frame_id: gps_link
      ntrip:
        mountpoint: OsgoodeFarms
        username: farabi@tandemrobotics.ca
behaviors:
  gps_navigation: true
ros_parameters:
  person_detector:
    max_detections_per_second: 20.0
  person_follow:
    distance_gain: 1.3
    distance_damping: 1.5
    standoff_distance_meters: 1.8
    distance_deadband_meters: 0.25
    steer_gain: 2.0
    steer_damping: 1.0
    command_smoothing_seconds: 0.3
    max_forward_speed_meters_per_second: 1.60
    max_backward_speed_meters_per_second: 1.60
    max_angular_speed_radians_per_second: 1.60
