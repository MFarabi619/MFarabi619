serial_number: mark-1
version: 1
system:
  namespace: jiro
  hosts:
    - hostname: rpi5-16
      ip: 0.0.0.0
      board: rpi_5
platform:
  attachments: []
  drivetrain:
    model: pwm_dir
    pwm_frequency_hz: 20000.0
    max_linear_velocity_mps: 2.29
    left:
      pwm_pin: 32
      dir_pin: 36
      forward_level: true
    right:
      pwm_pin: 33
      dir_pin: 37
      forward_level: false
sensors:
  camera:
    - model: oak_d_pro_w_poe
      parent: base_link
      xyz: [0.35, 0.0, 0.36]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        camera_0:
          ip: 169.254.1.222
          fps: 30.0
          color_resolution_divisor: 2
          depth_resolution_divisor: 4
    # - model: oak_d_sr
    #   parent: base_link
    #   xyz: [0.575, 0.5, 0.31]
    #   rpy: [0.0, 0.0, 0.0]
    #   ros_parameters:
    #     camera_0: {}

follow:
  max_forward_speed: 0.8
  max_backward_speed: 0.8
  max_angular_speed: 2.0
