system:
  namespace: jiro
  hosts:
    - hostname: rpi5-16
      ip: 0.0.0.0
      board: rpi_5
platform:
  attachments: []
  collision_guarded: false
  rc_receiver:
    channel_1_pin: 11
    channel_2_pin: 13
  drivetrain:
    model: pwm_dir
    pwm_frequency_hz: 20000.0
    max_linear_velocity_meters_per_second: 2.29
    max_angular_velocity_radians_per_second: 3.0
    max_linear_acceleration_meters_per_second_squared: 8.0
    max_linear_jerk_meters_per_second_cubed: 60.0
    max_angular_acceleration_radians_per_second_squared: 10.0
    max_angular_jerk_radians_per_second_cubed: 70.0
    left:
      pwm_pin: 32
      dir_pin: 36
      forward_level: true
    right:
      pwm_pin: 33
      dir_pin: 37
      forward_level: false
sensors:
  camera:
    - model: oak_d_pro_w_poe
      detects_on_camera: false
      parent: base_link
      xyz: [0.35, 0.0, 0.36]
      rpy: [0.0, 0.0, 0.0]
      parameters:
        ip: 169.254.1.222
        depth_fps: 30.0
        color_fps: 60.0
        color_resolution_divisor: 2
        depth_resolution_divisor: 4
    # - model: oak_d_sr
    #   parent: base_link
    #   xyz: [0.575, 0.5, 0.31]
    #   rpy: [0.0, 0.0, 0.0]
behaviors:
  line: true
  sidewalk: true
  park_path: true
  path: true
