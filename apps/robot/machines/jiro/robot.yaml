# yaml-language-server: $schema=../robot.schema.json
system:
  namespace: jiro
  mavlink_system_id: 2
  hosts:
    # - hostname: rpi5-16
    #   ip: 0.0.0.0
    #   board: rpi_5
    - hostname: jetson-orin-nx
      ip: 10.0.0.57
      board: jetson_orin_nx
platform:
  collision_guarded: false
  rc_receiver:
    interface: usb_joystick
    # channel_1_pin: 11
    # channel_2_pin: 13
  drivetrain:
    model: pwm_dir
    pwm_frequency_hz: 20000.0
    max_linear_velocity_meters_per_second: 2.29
    max_angular_velocity_radians_per_second: 3.0
    max_linear_acceleration_meters_per_second_squared: 8.0
    max_linear_jerk_meters_per_second_cubed: 60.0
    max_angular_acceleration_radians_per_second_squared: 10.0
    max_angular_jerk_radians_per_second_cubed: 70.0
    left:
      pwm_pin: 32
      dir_pin: 36
      forward_level: true
    right:
      pwm_pin: 33
      dir_pin: 37
      forward_level: false
sensors:
  camera:
    # - model: luxonis_oak_d_pro_w_poe
    #   detects_on_camera: false
    #   parent: base_link
    #   xyz: [0.35, 0.0, 0.36]
    #   rpy: [0.0, 0.0, 0.0]
    #   parameters:
    #     ip: 169.254.1.222
    #     depth_frames_per_second: 30.0
    #     color_frames_per_second: 60.0
    #     color_resolution_divisor: 2
    #     depth_resolution_divisor: 4
    - model: stereolabs_zed
      urdf_enabled: false
      parent: base_link
      xyz: [0.35, 0.0, 0.36]
      rpy: [0.0, 0.0, 0.0]
      parameters:
        general:
          camera_model: zed2i
          grab_resolution: HD720
          grab_frame_rate: 30
          pub_frame_rate: 30.0
        depth:
          depth_mode: NEURAL_PLUS
          depth_stabilization: 0
          openni_depth_mode: true
          publish_depth_image: true
          point_cloud_freq: 15.0
        object_detection:
          od_enabled: false
        pos_tracking:
          pos_tracking_enabled: false
          publish_tf: false
          publish_map_tf: false
        sensors:
          publish_imu_tf: false
          publish_mag: true
          publish_baro: true
          publish_temp: true
    # - model: luxonis_oak_d_sr
    #   parent: base_link
    #   xyz: [0.575, 0.5, 0.31]
    #   rpy: [0.0, 0.0, 0.0]
  # gps:
  #   - model: ublox_zed_f9p
  #     parent: base_link
  #     xyz: [0.0, 0.0, 0.30]
  #     flash:
  #       # Receiver flash asserted by ublox_flash at launch.
  #       CFG_RATE_MEAS: 200  # milliseconds between measurements = 5 Hz
  #       CFG_RATE_NAV: 1  # navigation solutions per measurement
  #     parameters:
  #       port: /dev/robot/gnss
  #       baud_rate: 115200
  #       frame_id: gps_link
  #     ntrip:
  #       mountpoint: OsgoodeFarms
  #       username: farabi@tandemrobotics.ca
behaviors:
  gps_navigation: true
  line_follow: true
  sidewalk_follow: true
  park_path_follow: true
  path_follow: true
ros_parameters:
  rc_receiver_teleop:
    scale_linear:
      x: 2.0
    scale_angular:
      yaw: 3.0
  person_detector:
    max_detections_per_second: 30.0
    model_path: ssd_mobilenet_v1_12_int8.onnx
  person_follow:
    max_forward_speed_meters_per_second: 2.0
    max_backward_speed_meters_per_second: 1.5
    max_angular_speed_radians_per_second: 5.0
    distance_gain: 2.0
    distance_deadband_meters: 0.25
    steer_gain: 2.0
  line_follow:
    image_width_pixels: 640
  sidewalk_follow:
    forward_speed_meters_per_second: 0.5
    steer_gain: 1.5
    max_angular_speed_radians_per_second: 1.5
  park_path_detector:
    roi_top_fraction: 0.6
    min_column_fraction: 0.95
  park_path_follow:
    forward_speed_meters_per_second: 0.9
    steer_gain: 1.5
    max_angular_speed_radians_per_second: 1.5
  path_follow:
    forward_speed_meters_per_second: 0.9
    steer_gain: 1.5
    max_angular_speed_radians_per_second: 1.5
    lateral_offset_meters: 0.35
