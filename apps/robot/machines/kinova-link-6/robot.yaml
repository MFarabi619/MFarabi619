serial_number: mark-4
version: 1
system:
  hosts:
    - hostname: jetson-orin-nano
      ip: 10.0.0.180
      board: jetson_orin_nano
arm:
  model: kinova_link_6
  gripper: robotiq_2f_85
  bringup_package: link6_bringup
  description_package: link6_description
  control_package: link6_control
  moveit_package: link6_moveit_config
  moveit_robot_name: link6
manipulation:
  demonstration_joint_positions_radians: [0.5, -0.4, 0.6, 0.0, 0.5, 0.0]
sensors:
  camera:
    - model: zed_2
      urdf_enabled: false
      parent: base_link
      xyz: [1.0, 0.0, 0.5]
      rpy: [0.0, 0.0, 3.1416]
      ros_parameters:
        camera_0:
          general:
            grab_resolution: HD720
            grab_frame_rate: 30
            pub_frame_rate: 0.0
          depth:
            depth_mode: NEURAL_PLUS
            openni_depth_mode: true
            publish_depth_image: true
            point_cloud_freq: 15.0
          pos_tracking:
            pos_tracking_enabled: false
            publish_tf: false
            publish_map_tf: false
          sensors:
            publish_imu_tf: false
