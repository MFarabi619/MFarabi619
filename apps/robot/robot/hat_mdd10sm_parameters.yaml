hat_mdd10sm:
  rgpiod_host:
    type: string
    default_value: "rpi5-16"
    description: "Hostname or IP of the SBC running rgpiod. Tailnet name works best (source IP matches the -n allowlist)."

  rgpiod_port:
    type: int
    default_value: 8889

  gpio_chip:
    type: int
    default_value: 0
    description: "GPIO chip number to open on the SBC."

  pwm_frequency_hz:
    type: int
    default_value: 1000
    description: "PWM frequency for the motor channels."
    validation:
      bounds<>: [100, 20000]

  left_pwm_pin:
    type: int
    default_value: 12
    description: "GPIO pin for the left motor's PWM (speed) signal."

  right_pwm_pin:
    type: int
    default_value: 13
    description: "GPIO pin for the right motor's PWM (speed) signal."

  left_dir_pin:
    type: int
    default_value: 26
    description: "GPIO pin for the left motor's direction signal."

  right_dir_pin:
    type: int
    default_value: 24
    description: "GPIO pin for the right motor's direction signal."

  left_forward_level:
    type: int
    default_value: 1
    description: "Direction-pin level that drives the left motor forward. Differs from right_forward_level because MDD10 channels are wired physically mirrored on the chassis."
    validation:
      bounds<>: [0, 1]

  right_forward_level:
    type: int
    default_value: 0
    description: "Direction-pin level that drives the right motor forward. Differs from left_forward_level because MDD10 channels are wired physically mirrored on the chassis."
    validation:
      bounds<>: [0, 1]

  duty_scale:
    type: double
    default_value: 50.0
    description: "Percent PWM duty per unit of wheel speed."
    validation:
      bounds<>: [0.0, 100.0]
