[pytest]
minversion = 9.1
addopts =
    -ra
    --strict-markers
    --strict-config
xfail_strict = true
markers =
    linter: ament lint checks; run via `pixi r lint` (colcon), excluded from `pixi r test`
    flake8: ament_flake8 style check
    mypy: ament_mypy type check
    copyright: ament_copyright header check
    pep257: ament_pep257 docstring check
    xmllint: ament_xmllint package.xml check
