[package]
name = "robot"
version = "0.1.0"
edition = "2021"
default-run = "base_controller"

[dependencies]
robot_description = { path = "robot_description" }
robot_drivers = { path = "robot_drivers" }
robot_control = { path = "robot_control" }
robot_diagnostics = { path = "robot_diagnostics" }
robot_sensors = { path = "robot_sensors" }
robot_perception = { path = "robot_perception", optional = true }
oxidros = { git = "https://github.com/jazi007/oxidros", rev = "566e2efdff31e39b372bab54fb75b2e836ba5ca7", features = ["zenoh"] }
zenoh = { version = "1", features = ["unstable"] }
zenoh-ext = { version = "1", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
foxglove = "0.25.3"
serde_json = "1"
rattler_shell = { version = "0.27", optional = true }
rattler_conda_types = { version = "0.48", optional = true }

[features]
default = ["perception", "pixi"]
perception = ["dep:robot_perception"]
pixi = ["dep:rattler_shell", "dep:rattler_conda_types"]

[dev-dependencies]
robot_simulator = { path = "robot_simulator" }
tokio-tungstenite = "0.26"
futures-util = "0.3"
comfy-table = "7"
ratatui = { workspace = true, features = ["crossterm", "all-widgets"] }
crossterm = { version = "0.29", features = ["event-stream"] }

[[bin]]
name = "ros2"
required-features = ["pixi"]

[[example]]
name = "task"
required-features = ["pixi"]

[[example]]
name = "gazebo"
required-features = ["pixi"]

[[example]]
name = "simulator"
required-features = ["perception"]

[[example]]
name = "green_approach"
required-features = ["perception"]

[lints.clippy]
all = "deny"
