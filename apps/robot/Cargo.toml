[package]
name = "robot"
version = "0.1.0"
edition = "2021"
default-run = "cytron_md30c"

[package.metadata.fetch-source]
lg = { git = "https://github.com/joan2937/lg.git", tag = "v0.2.2" }

[dependencies]
oxidros = { git = "https://github.com/jazi007/oxidros", rev = "566e2efdff31e39b372bab54fb75b2e836ba5ca7", features = ["zenoh"] }
zenoh = { version = "1", features = ["unstable"] }
zenoh-ext = { version = "1", features = ["unstable"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
foxglove = "0.25.3"
serde_json = "1"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
jpeg-encoder = "0.7"

[build-dependencies]
fetch-source = "0.1.2"
cc = "1"

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"

[lints.clippy]
all = "deny"
