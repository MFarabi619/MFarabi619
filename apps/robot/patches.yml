patches:
    - path: better-launch.patch
      sha256sum: 25468137784c03dff42375f8cebf1e0665ef637607e156488d951d7f28e9d1c4
      module: vendor/better_launch
      author: Mumtahin Farabi
      email: mfarabi619@gmail.com
      date: 2026-10-12
      upstreamable: true
      comments: |
          foreign_node.py + node.py: catch psutil AccessDenied/NoSuchProcess
          when scanning processes (macOS pid 1).
          ros2_launch_wrapper.py: SIGINT calls launch_service.shutdown().
          launcher.py: is_shutdown true before children are signalled.
          node.py: respawn re-activates lifecycle nodes.

    - path: ros2-link6.patch
      sha256sum: a8c808ba2fe18a6b9a5b1a3eb5921fc0ef97917a4f2caf35a9ef1d6a1ad6b289
      module: vendor/ros2_link6
      author: Mumtahin Farabi
      email: mfarabi619@gmail.com
      date: 2026-11-08
      upstreamable: true
      comments: |
          link6_sim.launch.py: spawn_x/y/z args; spawners get --param-file;
          joint_velocity_controller spawner dropped.
          link6_description: sim_mujoco arg chain -> MujocoSystemInterface;
          position command interfaces in sim (gz also velocity); accessory
          visuals + collision box; brighter palette; spawn at SRDF home;
          gripper spawns open in sim; mesh URIs package:// instead of
          file://$(find).
          kortex3_sim_controllers.yaml: jtc [position], goal tolerances
          0.025, nonzero end velocity, gripper stall 0.01/0.5s,
          enforce_command_limits off.
          kortex3_controllers.yaml: nonzero end velocity.
          moveit_controllers.yaml: duration monitoring off, start
          tolerance 0.05.
          link6.srdf: controller_link adjacent pairs disabled.
          Not upstreamable as-is (mesh paths point into our package).

    - path: mujoco-ros2-control.patch
      sha256sum: 75c47ca920ca4a08cfb8ea10981c1e193bb43787d959ff7425e07c0c9041f467
      module: vendor/mujoco_ros2_control
      author: Mumtahin Farabi
      email: mfarabi619@gmail.com
      date: 2026-11-08
      upstreamable: true
      comments: |
          macOS build port. CMakeLists: EGL and GNU-ld workarounds gated
          off APPLE, @loader_path INSTALL_RPATH on APPLE. camera_plugin:
          no-op on APPLE. heartbeat %lu -> %llu; -Wno-error=conversion
          on APPLE.

    - path: ros2-controllers.patch
      sha256sum: 3e19ed643093a482d9e86fff656145a404404906064d1ec37ec6d83ab836e104
      module: vendor/ros2_controllers
      author: Mumtahin Farabi
      email: mfarabi619@gmail.com
      date: 2026-11-08
      upstreamable: false
      comments: |
          Vendored for gripper_controllers (removed upstream #1652).
          COLCON_IGNORE at root. ament_target_dependencies ->
          target_link_libraries; get_value() -> get_optional().

    - path: cartesian-controllers.patch
      sha256sum: 6ea17a5d8daaf4254d2ed1c8268a7feb0efbfa10652fcf58c1ff13e760959f7b
      module: vendor/cartesian_controllers
      author: Mumtahin Farabi
      email: mfarabi619@gmail.com
      date: 2026-11-08
      upstreamable: false
      comments: |
          Lyrical port (upstream frozen 2024-10). CMakeLists: distro gate
          accepts lyrical, Eigen3 floor dropped, vendored jazzy
          ament_target_dependencies macro. realtime_publisher.h -> .hpp;
          get_value() -> get_optional(); RealtimePublisher -> try_publish;
          handle vectors clear+reserve before get_ordered_interfaces.

    - path: audio-common.patch
      sha256sum: 9a23095b60e0a4ff53216b34f3d754750b57e22569fad126d5612a368ed62a12
      module: vendor/audio_common
      author: Mumtahin Farabi
      email: mfarabi619@gmail.com
      date: 2026-11-07
      upstreamable: true
      comments: |
          clang-format lint made optional; ament_cmake_clang_format is not
          in the pixi envs.

    - path: nmea-navsat-driver.patch
      sha256sum: a5bbe615d52da2d8e430bf120aba3cf8cb178fe07cffb16695d825014848c585
      module: vendor/nmea_navsat_driver
      author: Mumtahin Farabi
      email: mfarabi619@gmail.com
      date: 2026-11-11
      upstreamable: true
      comments: |
          Logger .warn() -> .warning(); rclpy on lyrical dropped the alias.
