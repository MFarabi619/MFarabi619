[workspace]
requires-pixi = ">=0.72.1"

channels = [
    "https://prefix.dev/robostack-lyrical",
    "https://prefix.dev/conda-forge",
]

platforms = [
    { platform = "linux-64", glibc = "2.34" },
    { platform = "osx-arm64", macos = "14.0" },
    { platform = "linux-aarch64", glibc = "2.36" },
]

[activation]
scripts = ["install/setup.sh"]

[activation.env]
ROS_DOMAIN_ID = "0"
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ROS_SUPER_CLIENT = "True"
BL_TUI_KEYBINDS = "nodes: c-n; loglevel: c-l"
YOLO_AUTOINSTALL = "false"
COLCON_DEFAULTS_FILE = "colcon-defaults.yaml"

[dependencies]
make = "*"
ninja = "*"
cmake = "*"
ccache = "*"
python = "*"
rosdep = "*"
requests = "*"
pydantic = "*"
pyserial = "*"
libopencv = "*"
compilers = "*"
pkg-config = "*"
portaudio = "*"
pygnssutils = "==1.3.0"
onnxruntime = "*"
onnxruntime-cpp = "*"
# ROS specific tools
transforms3d = "*"
rich = ">=15.0.0,<16"
ros-lyrical-py-trees = "*"
ros-lyrical-twist-mux = "*"
ros-lyrical-topic-tools = "*"
ros-lyrical-nav2-msgs = "*"
ros-lyrical-py-trees-ros = "*"
colcon-common-extensions = "*"
ros-lyrical-desktop-full = "*"
ros-lyrical-nav2-planner = "*"
ros-lyrical-ros2-control = "*"
ros-lyrical-slam-toolbox = "*"
ros-lyrical-nav2-behaviors = "*"
ros-lyrical-nav2-controller = "*"
ros-lyrical-nav2-bt-navigator = "*"
ros-lyrical-nav2-rviz-plugins = "*"
ros-lyrical-nav2-navfn-planner = "*"
ros-lyrical-nav2-collision-monitor = "*"
ros-lyrical-nav2-simple-commander = "*"
ros-lyrical-nav2-waypoint-follower = "*"
ros-lyrical-nav2-regulated-pure-pursuit-controller = "*"

fmt = "*"
eigen = "*"
ros-lyrical-moveit-py = "*"
ros-lyrical-control-toolbox = "*"
ros-lyrical-moveit-planners = "*"
ros-lyrical-moveit-kinematics = "*"
ros-lyrical-moveit-configs-utils = "*"
ros-lyrical-moveit-ros-move-group = "*"
ros-lyrical-moveit-task-constructor-core = "*"
ros-lyrical-moveit-simple-controller-manager = "*"
ros-lyrical-moveit-task-constructor-capabilities = "*"

ros-lyrical-nmea-msgs = "*"
ros-lyrical-foxglove-msgs = "*"
ros-lyrical-gz-ros2-control = "*"
ros-lyrical-foxglove-bridge = "*"
ros-lyrical-geographic-msgs = "*"
ros-lyrical-ros2-controllers = "*"
ros-lyrical-pointcloud-to-laserscan = "*"
ros-lyrical-diagnostic-aggregator = "*"
ros-lyrical-py-trees-ros-interfaces = "*"

[pypi-dependencies]
pyubx2 = ">=1.3"
mediapipe = ">=1.0.0"
sherpa-onnx = ">=1.13"
depthai = ">=2.24,<3"
better-launch = { path = "../../vendor/better_launch", editable = true }
kortex-api = { url = "https://artifactory.kinovaapps.com/artifactory/generic-public/kortex/API/3.4.0/kortex_api-3.4.0.15-py3-none-any.whl" }

[pypi-options.dependency-overrides]
protobuf = ">=5.27.2"
deprecated = ">=1.2.7"

[target.linux.dependencies]
libgpiod = "*"
libgl-devel = "*"

[target.linux-aarch64.dependencies]
nlohmann_json = "*"
sysroot_linux-aarch64 = ">=2.28"
ros-lyrical-zed-description = "*"
ros-lyrical-depth-image-proc = "*"
ros-lyrical-robot-localization = "*"

[target.linux-aarch64.pypi-dependencies]
gpiod = "*"
adafruit-extended-bus = "*"
adafruit-circuitpython-bno08x = "*"

[target.osx-arm64.pypi-dependencies]
mujoco = "*"
trimesh = "*"
obj2mjcf = "*"
pycollada = "*"
odrive = ">=0.6.11"

[target.osx-arm64.dependencies]
lap = "*"
glfw = "*"
onnx = "*"
torchvision = "*"
ultralytics = ">=8.4"

ros-lyrical-ros-gz-sim = "*"
ros-lyrical-vision-msgs = "*"
ros-lyrical-ros-gz-image = "*"
ros-lyrical-ros-gz-bridge = "*"
ros-lyrical-sdformat-urdf = "*"
ros-lyrical-mujoco-vendor = "*"
ros-lyrical-apriltag-msgs = "*"
ros-lyrical-moveit-ros-visualization = "*"

[target.osx-arm64.activation.env]
LDFLAGS = "-Wl,-dead_strip_dylibs"

[tasks]
build = """
colcon build \
    --packages-ignore \
        audio_aec \
        zed_debug \
        kortex3_hardware \
        robotiq_hardware_tests \
        mujoco_3d_lidar \
        mujoco_ros2_control \
        mujoco_ros2_control_demos \
        mujoco_ros2_control_tests \
        mujoco_ros2_control_plugins \
        cartesian_controller_tests \
        cartesian_controller_simulation \
"""

clean = { cmd = "rm -rf build/{{ package }} install/{{ package }} {{ 'log' if not package }}", args = [
    { arg = "package", default = "" },
] }

lint = { cmd = "colcon test --base-paths . --ctest-args -L linter && colcon test-result --verbose", depends-on = [
    "build",
] }

test = { cmd = "pytest -c pytest.ini {{ suites }}", args = [
    { arg = "suites", default = "boot/test drivers/test machines/test navigation/test perception/test simulation/test" },
], env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }

deploy = { cmd = "python machines/deploy.py {{ robot }}", args = [
    { arg = "robot", default = "taro" },
], depends-on = [
    "build",
] }

robot = { cmd = """
python boot/launch/robot.launch.py \
    --robot '{{ robot }}' \
    --drivetrain_model '{{ drivetrain_model }}' \
    --domain '{{ domain }}'\
""", args = [
    { arg = "robot", default = "" },
    { arg = "drivetrain_model", default = "" },
    { arg = "domain", default = "" },
] }

zenoh-router = "python boot/launch/zenoh_router.launch.py"

generate-robot-schema = { cmd = "python machines/src/schema.py", depends-on = [
    "build",
] }

robot-health = { cmd = "python e2e/robot_health.py --robot {{ robot }}", args = [
    { arg = "robot", default = "taro" },
] }

e2e = { cmd = "python e2e/cmd_vel.py --robot {{ robot }}", args = [
    { arg = "robot", default = "taro" },
] }

sim = { cmd = """
python simulation/launch/simulation.launch.py \
    --world {{ world }} \
    --robots {{ robots }} \
    --depth_scan_enabled {{ depth_scan_enabled }} \
    --target {{ target }}\
""", args = [
    { arg = "world", default = "farm", choices = [
        "construction",
        "empty",
        "farm",
        "maize",
        "office",
        "orchard",
        "pipeline",
        "warehouse",
        "solar_farm",
        "plasticulture",
    ] },
    { arg = "robots", default = "taro,jiro" },
    { arg = "depth_scan_enabled", default = "false", choices = [
        "false",
        "true",
    ] },
    { arg = "target", default = "person", choices = [
        "person",
        "cone",
    ] },
], depends-on = [
    "build",
] }

generate-world = "python simulation/plasticulture_generator.py"

teleop = { cmd = "python boot/launch/teleop_twist_keyboard.launch.py --robot {{ robot }}", args = [
    { arg = "robot", default = "taro" },
] }

teleop-xiao = { cmd = "python boot/launch/teleop_xiao.launch.py --smoothing_enabled {{ smoothing_enabled }}", args = [
    { arg = "smoothing_enabled", default = "false", choices = [
        "false",
        "true",
    ] },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/10.0.0.247:7447"]' } }

set-home = { cmd = "python navigation/src/set_home.py --robot {{ robot }}", args = [
    { arg = "robot", default = "taro" },
] }

return-home = { cmd = "python navigation/src/return_home.py --robot {{ robot }}", args = [
    { arg = "robot", default = "taro" },
] }

waypoints = { cmd = "python navigation/src/waypoints.py --robot {{ robot }}", args = [
    { arg = "robot", default = "taro" },
] }

slam = { cmd = "python navigation/launch/slam.launch.py --robot {{ robot }}", args = [
    { arg = "robot", default = "jiro" },
] }

enable = { cmd = "python navigation/src/enable_behavior.py --robot {{ robot }} --behavior {{ behavior }} --enabled {{ enabled }}", args = [
    { arg = "robot", default = "taro" },
    { arg = "behavior", default = "person_follow", choices = [
        "canopy_detector",
        "hand_gesture_teleop",
        "harvest_lane",
        "line_follow",
        "nav2_person_follow",
        "park_path_follow",
        "path_follow",
        "person_follow",
        "person_follow_slow",
        "sidewalk_follow",
        "weeding",
    ] },
    { arg = "enabled", default = "true", choices = [
        "true",
        "false",
    ] },
] }

boot = { cmd = "python boot/launch/boot.launch.py --robot {{ robot }} --gesture_camera {{ gesture_camera }}", args = [
    { arg = "robot", default = "taro" },
    { arg = "gesture_camera", default = "webcam", choices = [
        "webcam",
        "robot",
    ] },
], depends-on = [
    "build",
] }

arm = { cmd = """
python simulation/launch/arm.launch.py \
    --robot {{ robot }} \
    --mode {{ mode }} \
    --headless {{ headless }} \
    --world {{ world }} \
    {% if gripper %}--gripper {{ gripper }}{% endif %}\
""", args = [
    { arg = "robot", default = "kinova-link-6" },
    { arg = "mode", default = "drag", choices = [
        "drag",
        "moveit",
    ] },
    { arg = "headless", default = "false", choices = [
        "false",
        "true",
    ] },
    { arg = "world", default = "farm", choices = [
        "construction",
        "empty",
        "farm",
        "maize",
        "office",
        "orchard",
        "pipeline",
        "plasticulture",
        "solar_farm",
        "warehouse",
    ] },
    { arg = "gripper", default = "" },
], depends-on = [
    "build",
] }

arm-mujoco = { cmd = "python simulation/launch/arm_mujoco.launch.py --robot {{ robot }} --mode {{ mode }} --headless {{ headless }}", args = [
    { arg = "robot", default = "kinova-link-6" },
    { arg = "mode", default = "moveit", choices = [
        "plain",
        "moveit",
    ] },
    { arg = "headless", default = "false", choices = [
        "false",
        "true",
    ] },
], depends-on = [
    "build",
] }

e2e-arm-sim = { cmd = "pytest e2e/arm_simulation.py -v -s", depends-on = [
    "build",
] }

kinova-link-6 = { cmd = """
python manipulation/launch/kinova_link6.launch.py \
    --motions_file machines/{{ robot }}/motions.yaml \
    --robot_password {{ robot_password }} \
    --rviz_enabled {{ rviz_enabled }}\
""", args = [
    { arg = "robot", default = "kinova-link-6" },
    { arg = "robot_password", default = "admin" },
    { arg = "rviz_enabled", default = "true", choices = [
        "true",
        "false",
    ] },
], depends-on = [
    "build",
] }

e2e-arm = { cmd = "pytest e2e/kinova_link6.py -v -s --robot-password {{ robot_password }}", args = [
    { arg = "robot_password", default = "admin" },
] }

arm-drag = { cmd = """
ros2 control switch_controllers \
    {% if enabled == "true" %}\
    --activate motion_control_handle cartesian_motion_controller \
    --deactivate joint_trajectory_controller\
    {% else %}\
    --activate joint_trajectory_controller \
    --deactivate motion_control_handle cartesian_motion_controller\
    {% endif %}\
""", args = [
    { arg = "enabled", default = "true", choices = [
        "true",
        "false",
    ] },
], env = { ZENOH_CONFIG_OVERRIDE = "", ZENOH_SESSION_CONFIG_URI = ".pixi/envs/default/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5" } }

arm-grip = { cmd = """
ros2 action send_goal \
    /robotiq_gripper_controller/gripper_cmd \
    control_msgs/action/GripperCommand \
    "{command: {position: {% if state == "open" %}0.0{% else %}0.8{% endif %}, max_effort: 60.0}}"\
""", args = [
    { arg = "state", default = "open", choices = [
        "open",
        "close",
    ] },
    { arg = "mdns_hostname", default = "jetson-orin-nano.local" },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/{{ mdns_hostname }}:7447"]', ZENOH_SESSION_CONFIG_URI = ".pixi/envs/default/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5" } }

arm-motion = { cmd = """
python manipulation/src/load_motions.py \
    && ros2 action send_goal \
        /robotiq_gripper_controller/gripper_cmd \
        control_msgs/action/GripperCommand \
        "{command: {position: 0.0, max_effort: 60.0}}" \
    && ros2 play_motion run {{ motion }}\
""", args = [
    { arg = "motion", default = "wave" },
    { arg = "mdns_hostname", default = "jetson-orin-nano.local" },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/{{ mdns_hostname }}:7447"]', ZENOH_SESSION_CONFIG_URI = ".pixi/envs/default/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5" } }

arm-pick = { cmd = "python manipulation/launch/kinova_link6_pick.launch.py --target_object {{ target_object }}", args = [
    { arg = "target_object", default = "apple" },
    { arg = "mdns_hostname", default = "jetson-orin-nano.local" },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/{{ mdns_hostname }}:7447"]', ZENOH_SESSION_CONFIG_URI = ".pixi/envs/default/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5" } }

arm-place = { cmd = "python manipulation/src/kinova_link6_place.py --target_object {{ target_object }}", args = [
    { arg = "target_object", default = "apple" },
    { arg = "mdns_hostname", default = "jetson-orin-nano.local" },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/{{ mdns_hostname }}:7447"]', ZENOH_SESSION_CONFIG_URI = ".pixi/envs/default/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5" } }

arm-reach = { cmd = """
python manipulation/src/reach.py \
    --robot {{ robot }} \
    {% if target %}--target {{ target }}{% endif %} \
    {% if x %}--x {{ x }} --y {{ y }} --z {{ z }}{% endif %}\
""", args = [
    { arg = "robot", default = "kinova-link-6" },
    { arg = "target", default = "" },
    { arg = "x", default = "" },
    { arg = "y", default = "" },
    { arg = "z", default = "" },
    { arg = "mdns_hostname", default = "jetson-orin-nano.local" },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/{{ mdns_hostname }}:7447"]', ZENOH_SESSION_CONFIG_URI = ".pixi/envs/default/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5" } }

arm-recover = { cmd = 'python manipulation/src/kinova_link6_recover.py --program "{{ program }}" --robot-password "{{ robot_password }}"', args = [
    { arg = "program", default = "Home Position" },
    { arg = "robot_password", default = "admin" },
] }

arm-pick-record = { cmd = "python manipulation/src/kinova_link6_pick_hardware.py --record {{ pose }}", args = [
    { arg = "pose", default = "grasp" },
] }

arm-pick-hardware = { cmd = """
python manipulation/src/kinova_link6_pick_hardware.py \
    --grasp-pose {{ grasp_pose }} \
    --force {{ force }} \
    --velocity {{ velocity }} \
    --joint-speed {{ joint_speed }}\
""", args = [
    { arg = "grasp_pose", default = "grasp" },
    { arg = "force", default = "10" },
    { arg = "velocity", default = "50" },
    { arg = "joint_speed", default = "30" },
] }

arm-place-hardware = { cmd = """
python manipulation/src/kinova_link6_pick_hardware.py \
    --place \
    --grasp-pose {{ grasp_pose }} \
    --velocity {{ velocity }} \
    --joint-speed {{ joint_speed }}\
""", args = [
    { arg = "grasp_pose", default = "grasp" },
    { arg = "velocity", default = "50" },
    { arg = "joint_speed", default = "30" },
] }

arm-deliver-hardware = { cmd = """
python manipulation/src/kinova_link6_pick_hardware.py \
    --deliver \
    --grasp-pose {{ grasp_pose }} \
    --destination {{ destination }} \
    --force {{ force }} \
    --velocity {{ velocity }} \
    --joint-speed {{ joint_speed }}\
""", args = [
    { arg = "grasp_pose", default = "grasp" },
    { arg = "destination", default = "dropoff" },
    { arg = "force", default = "10" },
    { arg = "velocity", default = "50" },
    { arg = "joint_speed", default = "30" },
] }

arm-demo-hardware = { cmd = """
python manipulation/src/kinova_link6_pick_hardware.py \
    --tour grasp dropoff third_stop fourth_stop grasp \
    --force {{ force }} \
    --joint-speed {{ joint_speed }}\
""", args = [
    { arg = "force", default = "10" },
    { arg = "joint_speed", default = "30" },
] }

[target.osx-arm64.tasks]
build = """
colcon build \
    --packages-ignore \
        audio_aec \
        kortex3_hardware \
        cartesian_controller_simulation \
        cartesian_controller_tests \
        zed_components \
        zed_debug \
        zed_ros2 \
        zed_wrapper\
"""
