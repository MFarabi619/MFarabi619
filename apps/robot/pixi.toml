[workspace]
requires-pixi = ">=0.72.1"
channels = [
  "https://prefix.dev/robostack-lyrical",
  "https://prefix.dev/conda-forge",
]
platforms = [
  { platform = "linux-64", glibc = "2.34" },
  "osx-arm64",
  { platform = "linux-aarch64", glibc = "2.36" },
]

[activation]
scripts = ["install/setup.sh"]
env = { ROS_DOMAIN_ID = "0", RMW_IMPLEMENTATION = "rmw_zenoh_cpp", ROS_SUPER_CLIENT = "True", BL_TUI_KEYBINDS = "nodes: c-n; loglevel: c-l", YOLO_AUTOINSTALL = "false" }

[dependencies]
python = "*"
onnxruntime = "*"
# Build tools
make = "*"
ninja = "*"
cmake = "*"
rosdep = "*"
requests = "*"
pyserial = "*"
compilers = "*"
pkg-config = "*"
# ROS specific tools
transforms3d = "*"
rich = ">=15.0.0,<16"
ros-lyrical-py-trees = "*"
ros-lyrical-twist-mux = "*"
ros-lyrical-py-trees-ros = "*"
colcon-common-extensions = "*"
ros-lyrical-desktop-full = "*"
ros-lyrical-ros2-control = "*"
ros-lyrical-geographic-msgs = "*"
ros-lyrical-foxglove-bridge = "*"
ros-lyrical-ros2-controllers = "*"
ros-lyrical-pointcloud-to-laserscan = "*"
ros-lyrical-py-trees-ros-interfaces = "*"

[target.linux.pypi-dependencies]
better-launch = { git = "https://github.com/dfki-ric/better_launch", rev = "99aea170405745f342df1fa83a1a92810598c9ec" }

[target.linux.dependencies]
libgl-devel = "*"
libgpiod = "*"

[target.linux-64.dependencies]
ros-lyrical-foxglove-msgs = "*"
ros-lyrical-gz-ros2-control = "*"

[target.linux-64.pypi-dependencies]
mediapipe = ">=1.0.0"

[target.linux-aarch64.dependencies]
sysroot_linux-aarch64 = ">=2.28"
ros-lyrical-foxglove-msgs = "*"
ros-lyrical-depth-image-proc = "*"
ros-lyrical-diagnostic-aggregator = "*"

[target.linux-aarch64.pypi-dependencies]
gpiod = "*"
adafruit-extended-bus = "*"
adafruit-circuitpython-bno08x = "*"
depthai = ">=2.24,<3"

[target.osx-arm64.pypi-dependencies]
mediapipe = "*"
odrive = ">=0.6.11"
depthai = ">=2.24,<3"
better-launch = { path = "../../zephyrproject/modules/lib/better_launch", editable = true }

[target.osx-arm64.dependencies]
lap = "*"
onnx = "*"
pyside6 = "*"
torchvision = "*"
ultralytics = ">=8.4"

qt6-3d = "*"
qt6-scxml = "*"
qt6-charts = "*"
qt6-graphs = "*"
qt6-quick3d = "*"
qt6-sensors = "*"
qt6-datavis3d = "*"
qt6-webengine = "*"
qt6-serialport = "*"
qt6-multimedia = "*"
qt6-networkauth = "*"
ros-lyrical-vision-msgs = "*"
ros-lyrical-foxglove-msgs = "*"
ros-lyrical-gz-ros2-control = "*"
ros-lyrical-diagnostic-aggregator = "*"

[environments]
jazzy = { features = ["jazzy"], no-default-feature = true }

[feature.jazzy]
channels = [
  "https://prefix.dev/robostack-jazzy",
  "https://prefix.dev/conda-forge",
]

[feature.jazzy.activation.env]
ROS_DOMAIN_ID = "0"
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ZENOH_CONFIG_OVERRIDE = "mode='client'"
ZENOH_SESSION_CONFIG_URI = "navigation/config/zenoh_local_client.json5"

[feature.jazzy.dependencies]
python = "3.12.*"
ros-jazzy-nav2-amcl = "*"
ros-jazzy-slam-toolbox = "*"
ros-jazzy-nav2-planner = "*"
ros-jazzy-nav2-smoother = "*"
ros-jazzy-nav2-behaviors = "*"
ros-jazzy-nav2-map-server = "*"
ros-jazzy-nav2-controller = "*"
ros-jazzy-nav2-bt-navigator = "*"
ros-jazzy-nav2-navfn-planner = "*"
ros-jazzy-rmw-zenoh-cpp = ">=0.2.9"
ros-jazzy-nav2-mppi-controller = "*"
ros-jazzy-nav2-velocity-smoother = "*"
ros-jazzy-nav2-lifecycle-manager = "*"
ros-jazzy-nav2-collision-monitor = "*"

[feature.jazzy.target.linux-aarch64.dependencies]
ros-jazzy-rclpy = "*"
ros-jazzy-depthai-ros-msgs = "*"
ros-jazzy-nmea-navsat-driver = "*"
ros-jazzy-depthai-ros-driver = "*"
ros-jazzy-image-transport-plugins = "*"

[feature.jazzy.target.osx-arm64.dependencies]
ros-jazzy-ros2cli = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2node = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-ros2topic = "*"
ros-jazzy-nav2-bringup = "*"
ros-jazzy-apriltag-msgs = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-image-transport-plugins = "*"

[feature.jazzy.target.osx-arm64.pypi-dependencies]
better-launch = { path = "../../zephyrproject/modules/lib/better_launch", editable = true }

[feature.jazzy.tasks]
teleop-xiao = { cmd = "python bringup/launch/teleop_xiao.launch.py --smooth {{ smooth }}", args = [
  { arg = "smooth", default = "false" },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/10.0.0.247:7447"]' } }

[tasks]
build = "colcon build --merge-install --base-paths ."

_generate-param = { cmd = "ros2 run robot_generator_common generate_param", depends-on = [
  "build",
] }

lint = { cmd = "colcon test --base-paths . --merge-install --ctest-args -L linter --pytest-args -m linter --event-handlers console_direct+ && colcon test-result --verbose", depends-on = [
  "build",
] }

generate = { depends-on = ["_generate-param"] }

generate-world = "python simulator/plasticulture_generator.py"

launch = { cmd = "python bringup/launch/bringup.launch.py --gesture_camera {{ camera }}", args = [
  { arg = "camera", default = "webcam" },
], depends-on = [
  "build",
] }

gesture-teleop = { cmd = "python bringup/launch/bringup.launch.py --gesture_camera robot", depends-on = [
  "build",
] }

sim = { cmd = "python simulator/launch/simulation.launch.py --robots {{ robots }} --depth_scan {{ scan }}", args = [
  { arg = "robots", default = "robot0" },
  { arg = "scan", default = "false" },
], depends-on = [
  "generate",
] }

sim-server = { cmd = "python simulator/launch/simulation.launch.py --headless true", depends-on = [
  "generate",
] }

teleop = { cmd = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args --params-file config/keyboard_teleop.yaml -r cmd_vel:=joy_teleop/cmd_vel", args = [
  { arg = "host" },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/{{ host }}:7447"]' } }
follow-robot0 = { cmd = "python bringup/launch/follow.launch.py", env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/rpi5-16-2.local:7447"]' }, depends-on = [
  "build",
] }
follow-robot1 = { cmd = "python bringup/launch/follow.launch.py --max_forward_speed 0.8 --max_missing_frames 48 --max_angular_speed 0.3 --steer_gain 0.8 --steer_damping 0.6 --distance_damping 0.2 --command_smoothing 0.25 --steer_deadband 0.1 --lost_spin_decay 0.85 --max_retreat_speed 0.5", env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/rpi5-16.local:7447"]' }, depends-on = [
  "build",
] }
crop-row-robot0 = { cmd = "python bringup/launch/crop_row.launch.py", env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/rpi5-16-2.local:7447"]' }, depends-on = [
  "build",
] }

approach = { cmd = "python perception/launch/approach.launch.py --standoff_distance {{ standoff }}", args = [
  { arg = "standoff", default = "1.0" },
] }

follow-sidewalk = { cmd = "python perception/launch/sidewalk_follow.launch.py --target_offset {{ target }}", args = [
  { arg = "target", default = "0.0" },
] }

sidewalk = "python perception/src/sidewalk_detector.py"

row-navigate = { cmd = "python perception/src/row_navigator.py --ros-args -r scan:=/sensors/camera_0/scan -r path:=/perception/row_path", env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/rpi5-16-2:7447"]' } }

follow-row = { cmd = 'ros2 action send_goal --feedback /follow_row robot_platform_msgs/action/FollowRow "{travel_distance_m: {{ distance }}}"', args = [
  { arg = "distance", default = "18" },
], env = { ZENOH_SESSION_CONFIG_URI = "config/zenoh/client_session.json5" } }

follow-apriltag-robot0 = { cmd = "python perception/launch/apriltag_follow.launch.py --standoff_distance {{ standoff }}", args = [
  { arg = "standoff", default = "1.5" },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/rpi5-16-2:7447"]' } }

canopy = { cmd = "python perception/src/canopy_detector.py", env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/rpi5-16-2:7447"]' } }

# e2e = "python e2e/drive_profile.py --ros-args -p use_sim_time:=true"
e2e = { cmd = "python e2e/cmd_vel.py", args = [
  { arg = "host" },
], env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/{{ host }}:7447"]' } }
e2e-odrive = "python e2e/odrive_velocity.py"

cone-drill = "python e2e/cone_drill.py --ros-args -p use_sim_time:=true"

camera-check = "python e2e/camera_path.py"

slam-sim = "python navigation/launch/slam.launch.py --environment jazzy --use_sim_time true --scan_topic /sensors/camera_0/scan"

test = { cmd = "pytest -c pytest.ini config/test perception/test simulator/test -m 'not linter'", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }

test-cov = { cmd = "pytest -c pytest.ini config/test -m 'not linter' -p pytest_cov --cov=robot_config --cov-report=term-missing", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }

deploy = { cmd = "python config/deploy.py {{ robot }}", args = [
  { arg = "robot", default = "robot0" },
] }

robot = "python bringup/launch/robot.launch.py"

[target.linux-aarch64.tasks]
slam = "python navigation/launch/slam.launch.py"
oak-d-sr = "python drivers/src/oak_d_sr.py --ros-args -r __ns:=/sensors/camera_0 -p frame_id:=camera_0_link_right_camera_optical_frame"
