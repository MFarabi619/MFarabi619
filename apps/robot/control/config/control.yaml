/**/controller_manager:
  ros__parameters:
    update_rate: 50
    thread_priority: 50
    joint_state_broadcaster.type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller.type: diff_drive_controller/DiffDriveController

/**/diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["rear_left_wheel_joint"]
    right_wheel_names: ["rear_right_wheel_joint"]
    wheels_per_side: 1
    # wheel_separation / wheel_radius: generated from CAD datums into drivetrain.generated.yaml (robot_generator_common)
    publish_rate: 20.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    tf_frame_prefix: ""
    open_loop: true
    enable_odom_tf: true
    cmd_vel_timeout: 0.5

    linear.x.max_velocity: 2.0
    linear.x.max_acceleration: 8.0
    linear.x.max_jerk: 60.0
    angular.z.max_velocity: 3.0
    angular.z.max_acceleration: 10.0
    angular.z.max_jerk: 70.0
