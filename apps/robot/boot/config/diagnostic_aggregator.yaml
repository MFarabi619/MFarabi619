/**/diagnostic_aggregator:
  ros__parameters:
    path: Robot Diagnostics
    drive:
      type: diagnostic_aggregator/AnalyzerGroup
      path: Drive System
      analyzers:
        controllers:
          type: diagnostic_aggregator/GenericAnalyzer
          path: Controllers
          expected: [
            'controller_manager: Controller Manager Activity',
            'controller_manager: Controllers Activity',
            'controller_manager: Hardware Components Activity',
          ]
          contains: [ 'controller_manager' ]
        teleop:
          type: diagnostic_aggregator/GenericAnalyzer
          path: Teleop
          contains: [ 'twist_mux' ]
        motors:
          type: diagnostic_aggregator/GenericAnalyzer
          path: Motors
          contains: [ 'roboteq', 'pwm_dir_motor_driver' ]
    sensors:
      type: diagnostic_aggregator/AnalyzerGroup
      path: Sensors
      analyzers:
        cameras:
          type: diagnostic_aggregator/GenericAnalyzer
          path: Cameras
          contains: [ 'zed_node' ]
    computer:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Computer
      contains: [ 'cpu_monitor', 'ram_monitor', 'hd_monitor' ]
