CONFIG_NET_HOSTNAME="atoms3-lite"

CONFIG_ESPTOOLPY_OCT_FLASH=n
CONFIG_ESP_SPIRAM=n

CONFIG_I2C=y
CONFIG_I2C_SHELL=y

CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_SHELL=y

CONFIG_ESP_WIFI_HEAP_SYSTEM=y
CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16

CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_CONFIG_CLOCK_SNTP_INIT=n
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4096

CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_TCP_NODELAY=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_ZENOH_PICO_SESSION_CHECK=y
CONFIG_ZENOH_PICO_AUTO_RECONNECT=y
CONFIG_ZENOH_PICO_UNICAST_TRANSPORT=y
CONFIG_ZENOH_LOCATOR_DEFAULT="tcp/10.0.0.247:7447"

CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_MAX_PTHREAD_MUTEX_COUNT=32
