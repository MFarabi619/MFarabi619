[package]
name = "firmware"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "firmware"

[lib]
path = "lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "tui"
path = "bin/tui/main.rs"

[[bin]]
name = "simulator"
path = "bin/simulator/main.rs"

[[bin]]
name = "firmware"
path = "bin/main.rs"

[dependencies]
time   = { version = "0.3.45", default-features = false }
cfg-if = "1.0"
log    = "0.4"
libm   = "0.2"

[target.'cfg(target_os = "none")'.dependencies]
zephyr             = { workspace = true, features = ["time-driver", "executor-zephyr"] }
oh-my-zephyr       = { path = "../../libs/zephyr-lib-oh-my-zephyr" }
zephyr-lib-sqlite  = { path = "../../libs/zephyr-lib-sqlite" }
mousefood          = { version = "0.5", default-features = false, features = ["fonts", "blink"] }
ratatui            = { workspace = true, default-features = false, features = ["all-widgets"] }
embedded-graphics  = { version = "0.8", default-features = false }
probe-rs-meta      = { git = "https://github.com/probe-rs/probe-rs", rev = "8a7d9ebf9241ac80fca826181c97580f5211ad04" }

[target.'cfg(target_arch = "xtensa")'.dependencies]
static_cell = "2.1"

embassy-time             = { version = "0.4.0", features = ["tick-hz-100"] }
embassy-executor         = { version = "0.7.0", features = ["task-arena-size-2048"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratatui          = { workspace = true, features = ["all-widgets", "layout-cache"] }
ratzilla         = "0.3.0"
critical-section = { version = "1", features = ["std"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "none")))'.dependencies]
crossterm                   = "0.29.0"
embedded-graphics           = "0.8"
embedded-graphics-simulator = "0.8"
tui-big-text                = "0.8"
mousefood                   = { version = "0.5", features = ["fonts", "blink"] }
ratatui                     = { workspace = true, features = ["crossterm", "all-widgets"] }
probe-rs                    = "0.31"
serialport                  = { version = "4", features = ["usbportinfo-interface"] }
comfy-table                 = "7"

[build-dependencies]
zephyr-build = { workspace = true }

[package.metadata.trunk.build]
inject_scripts = true
release        = true
filehash       = false
dist           = "dist"
minify         = "always"
target         = "index.html"
