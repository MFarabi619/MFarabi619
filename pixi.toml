[workspace]
requires-pixi = ">=0.72.1"
channels = [
    "https://prefix.dev/robostack-lyrical",
    "https://prefix.dev/conda-forge",
]
platforms = [
    { platform = "linux-64", glibc = "2.34" },
    "osx-arm64",
    "linux-aarch64",
]

[activation]
scripts = ["install/setup.sh"]
env = { ROS_DOMAIN_ID = "0", RMW_IMPLEMENTATION = "rmw_zenoh_cpp", ROS_SUPER_CLIENT = "True", BL_TUI_KEYBINDS = "nodes: c-n; loglevel: c-l" }

[dependencies]
python = "*"
# Build tools
make = "*"
ninja = "*"
cmake = "*"
rosdep = "*"
requests = "*"
compilers = "*"
pkg-config = "*"
# ROS specific tools
transforms3d = "*"
ros-lyrical-twist-mux = "*"
colcon-common-extensions = "*"
ros-lyrical-desktop-full = "*"
ros-lyrical-ros2-control = "*"
ros-lyrical-foxglove-bridge = "*"
ros-lyrical-ros2-controllers = "*"

[pypi-dependencies]
better-launch = { git = "https://github.com/dfki-ric/better_launch", rev = "99aea170405745f342df1fa83a1a92810598c9ec" }

[target.linux.dependencies]
libgl-devel = "*"

[target.linux-aarch64.dependencies]
sysroot_linux-aarch64 = ">=2.28"
ros-lyrical-diagnostic-aggregator = "*"

[target.linux-aarch64.pypi-dependencies]
gpiod = "*"
adafruit-extended-bus = "*"
adafruit-circuitpython-bno08x = "*"

[target.osx-arm64.pypi-dependencies]
mediapipe = "*"

[target.osx-arm64.dependencies]
ros-lyrical-vision-msgs = "*"
ros-lyrical-foxglove-msgs = "*"
ros-lyrical-gz-ros2-control = "*"

[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]
platforms = ["linux-aarch64"]

[feature.jazzy.dependencies]
python = "3.12.*"
ros-jazzy-rclpy = "*"
ros-jazzy-rmw-zenoh-cpp = "*"
ros-jazzy-orbbec-camera = "*"
ros-jazzy-nmea-navsat-driver = "*"
ros-jazzy-image-transport-plugins = "*"

[feature.jazzy.pypi-dependencies]
pyorbbecsdk2 = "*"

[environments]
jazzy = { features = ["jazzy"], no-default-feature = true }

[tasks]
build = "colcon build --symlink-install --merge-install --base-paths apps/robot"

generate-param = { cmd = "ros2 run robot_generator_common generate_param", depends-on = [
    "build",
] }

generate-gz-launch = { cmd = "ros2 run robot_generator_gz generate_gz_launch", depends-on = [
    "build",
] }

generate-sensor-launch = { cmd = "ros2 run robot_generator_sensors generate_sensor_launch", depends-on = [
    "build",
] }

generate = { depends-on = [
    "generate-param",
    "generate-gz-launch",
    "generate-sensor-launch",
] }

launch = { cmd = "ros2 launch robot_bringup bringup.launch.py", depends-on = [
    "build",
] }

sim = { cmd = "ros2 launch robot_gz simulation.launch.py", depends-on = [
    "generate",
] }

sim-headless = { cmd = "ros2 launch robot_gz simulation.launch.py headless:=true", depends-on = [
    "generate",
] }

teleop = { cmd = """ZENOH_CONFIG_OVERRIDE='mode="client";connect/endpoints=["tcp/{{ host }}:7447"]' ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args --params-file apps/robot/config/teleop.yaml -r cmd_vel:=joy_teleop/cmd_vel""", args = [
    { arg = "host", default = "beagleyai" },
] }

teleop-sim = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args --params-file apps/robot/config/teleop.yaml -r cmd_vel:=joy_teleop/cmd_vel"

deploy = { cmd = "python apps/robot/config/deploy.py {{ robot }}", args = [
    { arg = "robot", default = "robot0" },
] }

[target.linux-aarch64.tasks]
robot = "ros2 launch robot_bringup robot.launch.py"
