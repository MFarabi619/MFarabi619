[workspace]
preview = ["pixi-build"]
requires-pixi = ">=0.72.2"
channels = ["https://prefix.dev/conda-forge"]
platforms = [{ platform = "linux-64", glibc = "2.34" }, "osx-arm64"]
# https://robostack.github.io/GettingStarted.html

[dependencies]
python = "*"
# Build tools
make = "*"
ninja = "*"
cmake = "*"
compilers = "*"
pkg-config = "*"
# ROS specific tools
rosdep = "*"
transforms3d = "*"
colcon-common-extensions = "*"

[target.linux.dependencies]
libgl-devel = "*"

[environments]
default.features = ["ros2"]

[feature.ros2]
channels = ["https://prefix.dev/robostack-lyrical"]

[feature.ros2.activation]
scripts = ["install/setup.sh"]
env = { ROS_DOMAIN_ID = "0", RMW_IMPLEMENTATION = "rmw_zenoh_cpp", ROS_SUPER_CLIENT = "True", BL_TUI_KEYBINDS = "nodes: c-n; loglevel: c-l" }

[feature.ros2.dependencies]
ros-lyrical-twist-mux = "*"
ros-lyrical-vision-msgs = "*"
ros-lyrical-desktop-full = "*"
ros-lyrical-ros2-control = "*"
ros-lyrical-foxglove-msgs = "*"
ros-lyrical-foxglove-bridge = "*"
ros-lyrical-gz-ros2-control = "*"
ros-lyrical-ros2-controllers = "*"
ros-lyrical-nmea-navsat-driver = "*"

[feature.ros2.tasks]
_build = { cmd = "colcon build --symlink-install --base-paths apps/robot" }

_generate = { cmd = "ros2 run robot_generator_common generate_param && ros2 run robot_generator_gz generate_gz_launch && ros2 run robot_generator_sensors generate_sensor_launch", depends-on = [
    "_build",
] }

launch = { cmd = "ros2 launch robot_bringup bringup.launch.py", depends-on = [
    "_generate",
] }

sim = { cmd = "ros2 launch robot_gz simulation.launch.py", depends-on = [
    "_generate",
] }

sim-headless = { cmd = "ros2 launch robot_gz simulation.launch.py headless:=true", depends-on = [
    "_generate",
] }

teleop = { cmd = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args --params-file apps/robot/config/teleop.yaml -r cmd_vel:=joy_teleop/cmd_vel", env = { ZENOH_CONFIG_OVERRIDE = 'mode="client";connect/endpoints=["tcp/10.0.0.222:7447"]' } }

teleop-sim = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args --params-file apps/robot/config/teleop.yaml -r cmd_vel:=joy_teleop/cmd_vel"

turtlesim = "ros2 launch robot_bringup turtlesim.launch.py"

fetch-gesture-model = { cmd = "curl -fsSL --create-dirs -o apps/robot/perception/robot_perception/models/gesture_recognizer.task https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task", outputs = [
    "apps/robot/perception/robot_perception/models/gesture_recognizer.task",
] }

vision = "python apps/robot/perception/robot_perception/vision.py"

gesture = { cmd = "python apps/robot/perception/robot_perception/gesture_node.py", depends-on = [
    "fetch-gesture-model",
] }

[feature.ros2.pypi-dependencies]
mediapipe = "*"
better-launch = { git = "https://github.com/dfki-ric/better_launch", rev = "99aea170405745f342df1fa83a1a92810598c9ec" }
