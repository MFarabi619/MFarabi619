[workspace]
version = "0.1.0"
name = "MFarabi619"
requires-pixi = ">=0.40"
channels = ["https://prefix.dev/conda-forge"]
authors = ["Mumtahin Farabi <mfarabi619@gmail.com>"]
platforms = [{ platform = "linux-64", glibc = "2.34" }, "osx-arm64"]

[activation]
scripts = ["install/setup.bash"]

[dependencies]
git = "*"
make = "*"
cmake = "*"
ninja = "*"
python = "*"
compilers = "*"
pkg-config = "*"
colcon-common-extensions = "*"

[tasks]
rviz = "rviz2"
test = { cmd = "pytest apps/robot/test -v", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }
bridge = "ros2 run foxglove_bridge foxglove_bridge"
record = { cmd = "bl robot record.launch.py", depends-on = ["build"] }

[tasks.build]
cmd = "colcon build --symlink-install --paths apps/robot --cmake-args -Wno-dev -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
inputs = ["apps/robot"]

[target.linux-64.dependencies]
libgl-devel = "*"

[target.osx-arm64.dependencies]
watchfiles = "*"

[target.osx-arm64.pypi-dependencies]
rgpio = "*"
build123d = "*"
yacv-server = "*"
bd-warehouse = "*"

[target.osx-arm64.tasks]
robot = { cmd = "bl robot robot.launch.py", depends-on = ["build"] }

[target.osx-arm64.tasks.cad]
cmd = "python main.py"
cwd = "libs/cad"
env = { YACV_HOST = "127.0.0.1", YACV_PORT = "32323" }

[environments]
default = { features = ["lyrical"] }
voice = { features = ["voice"], no-default-feature = true }

[feature.lyrical]
channels = ["https://prefix.dev/robostack-lyrical"]

[feature.lyrical.dependencies]
ros-lyrical-desktop = "*"
ros-lyrical-cv-bridge = "*"
ros-lyrical-better-launch = "*"
ros-lyrical-foxglove-bridge = "*"
ros-lyrical-image-publisher = "*"
ros-lyrical-diagnostic-updater = "*"
ros-lyrical-generate-parameter-library = "*"
ros-lyrical-generate-parameter-library-py = "*"

[feature.voice]
platforms = ["osx-arm64"]
dependencies.python = "3.14.*"

[feature.voice.pypi-dependencies]
pynput = "*"
mlx-whisper = "*"
sounddevice = "*"
websocket-client = "*"

[feature.voice.tasks.voice]
cmd = "python libs/voice/main.py"
env = { ROS2_BRIDGE_URL = "ws://localhost:8765", WHISPER_MODEL = "mlx-community/whisper-large-v3-turbo" }
